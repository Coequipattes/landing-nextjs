services:
  web:
    build: .
    expose:
      - "3000"
    volumes:
      - gallery-data:/app/src/data
      - gallery-uploads:/app/public/uploads/gallery
    env_file:
      - .env.local
    networks:
      - infra-net
    restart: unless-stopped

volumes:
  gallery-data:
  gallery-uploads:

networks:
  infra-net:
    external: true

