services:
  cron:
    image: alpine:3.21
    env_file:
      - .env.local
    networks:
      - infra-net
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        printf '#!/bin/sh\nwget -qO- --header "Authorization: Bearer %s" http://web:3000/api/admin/reviews && echo ok || echo fail\n' "$$CRON_SECRET" > /refresh.sh
        chmod +x /refresh.sh
        echo '0 3 * * * /refresh.sh' > /etc/crontabs/root
        exec crond -f -l 6

  web:
    build: .
    ports:
      - '127.0.0.1:3009:3000'
    volumes:
      - /home/benjamin/volumes/site-coequipattes/data:/app/src/data
      - /home/benjamin/volumes/site-coequipattes/gallery:/app/public/uploads/gallery
    env_file:
      - .env.local
    networks:
      - infra-net
    restart: unless-stopped

networks:
  infra-net:
    external: true
